# ==========================================================
# Configuración del proyecto del curso.
# Este archivo ES EL CANON de dependencias (fuente de verdad).
# requirements.txt se mantiene solo por compatibilidad con `pip install -r`.
#
# Instalación (recomendada, con uv):
#   uv sync            # crea/actualiza el venv y genera uv.lock
#   uv run pytest      # corre los tests
#
# Instalación clásica con pip:
#   pip install -e ".[dev]"
# ==========================================================

[project]
name = "curso-langchain"
version = "0.1.0"
description = "Curso de LangChain, LangGraph, MCP y RAG — ejemplos autónomos y testeados."
requires-python = ">=3.11"
dependencies = [
    # === Base de LangChain ===
    # Piezas base: mensajes, prompts, tools, runnables, vector store en memoria.
    "langchain-core==1.4.8",
    # Conexión con los modelos Gemini de Google (chat + embeddings).
    "langchain-google-genai==4.2.7",
    # Cliente para cualquier API que hable el dialecto de OpenAI: Groq, Ollama,
    # Together, OpenAI. Es lo que permite `LLM_PROVIDER=groq` en `util.crear_llm()`
    # cuando la (cortísima) cuota gratuita de Gemini se agota a mitad de ejercicio.
    # Va en las dependencias BASE, no en un extra: los ejercicios lo usan y se
    # instalan con `uv sync --extra dev`.
    "langchain-openai>=0.2",
    # Claude (Anthropic): NO habla el dialecto de OpenAI, así que tiene su
    # propia rama en `util.crear_llm()` (igual que Gemini). Es lo que permite
    # `LLM_PROVIDER=anthropic` en el .env sin tocar código.
    "langchain-anthropic==1.4.8",

    # === Agentes y grafos ===
    # Agentes: create_react_agent, StateGraph y memoria (checkpointer).
    "langgraph==1.2.8",

    # === Utilidades ===
    # Leer la llave secreta (GOOGLE_API_KEY) desde el archivo .env.
    "python-dotenv==1.2.2",
    # Moldes de datos para "salida estructurada" (BaseModel, Field).
    "pydantic==2.13.4",

    # === Model Context Protocol (MCP) ===
    # SDK oficial de MCP (FastMCP: crear servidores).
    "mcp==1.28.1",
    # Conectar servidores MCP como tools de LangChain/LangGraph.
    "langchain-mcp-adapters==0.3.0",

    # === Observabilidad ===
    # Tracing de ejecuciones (LangSmith). Solo se activa con LANGSMITH_API_KEY.
    "langsmith==0.9.8",
]

[project.optional-dependencies]
# Dependencias para desarrollo y tests. Instalar con:  uv sync --extra dev
# o:  pip install -e ".[dev]"
dev = [
    "pytest>=8.0",
    # TestClient de FastAPI (proyecto_llmops/tests/test_smoke_api.py) va sobre
    # httpx. Llegaba de rebote como dependencia de langsmith; declararlo aquí
    # evita que la suite se rompa el día que langsmith deje de traerlo.
    # TestClient conduce el `async` por dentro, así que la suite no necesita
    # ningún plugin de asyncio: los tests siguen siendo funciones normales.
    "httpx>=0.27",
]
# Embeddings LOCALES (EMBEDDINGS_PROVIDER=fastembed). Instalar con:
#   uv sync --extra emb
# Sirve para hacer RAG (temas 11, 12 y proyecto final) SIN gastar cuota de
# Gemini: Groq no ofrece embeddings, así que quien mueve el chat a Groq necesita
# esto o seguirá necesitando GOOGLE_API_KEY solo para vectorizar.
# Va en un extra y no en la base porque descarga un modelo de ~220 MB.
emb = [
    "fastembed>=0.4",
    # onnxruntime dejó de publicar wheels para macOS Intel tras la 1.23.2.
    # Sin el pin, `uv sync` falla al resolver en un Mac x86_64.
    "onnxruntime<1.24; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
# Interfaz web/servidor para el TEMA 17 (servir un agente por HTTP).
# Instalar con:  uv sync --extra ui   o:  pip install -e ".[ui]"
ui = [
    "fastapi>=0.115",
    "uvicorn==0.51.0",
]
# Proyecto LLMOps de producción (proyecto_llmops/): guardrails, semantic cache,
# observabilidad con Langfuse, RAG con pgvector y evaluación con tríada RAG.
# Instalar con:  uv sync --extra llmops   o:  pip install -e ".[llmops]"
# ⚠️ Requiere levantar los servicios:  docker compose -f proyecto_llmops/docker-compose.yml up -d
llmops = [
    # Langfuse v2, no v3: la v3 exige 6 contenedores (ClickHouse, MinIO, Redis,
    # worker…) y ~8 GB de RAM. La v2 corre con un solo Postgres. Además el SDK
    # cambió de API entre majors, así que lo acotamos: '>=2.0' se iría a la v3.
    "langfuse>=2,<3",               # observabilidad self-hosted (tracing @observe)
    "redis>=5.0",                   # backend del semantic cache
    "fastapi>=0.115",               # API REST (POST /chat, /health)
    "uvicorn==0.51.0",              # servidor ASGI para FastAPI
    "pydantic-settings>=2.0",       # settings tipados desde .env
    "jinja2>=3.1",                  # render de prompts como código (.yaml)
    # Leer esos .yaml. Llegaba de rebote con langchain-core; declararlo aquí
    # evita que prompts/loader.py se rompa si un día deja de traerlo.
    "pyyaml>=6.0",
    "langchain-postgres>=0.0.10",   # vector store sobre pgvector (Postgres)
    "psycopg[binary]>=3.1",         # driver Postgres (binario: sin compilar)
    "numpy>=1.26",                  # similitud coseno del semantic cache
    # Cliente OpenAI-compatible: con él, una sola clase habla con Groq, Ollama,
    # Together u OpenAI. Cambiar de proveedor = cambiar LLM_BASE_URL en el .env.
    "langchain-openai>=0.2",
    # Embeddings LOCALES (ONNX, sin API ni cuota). Groq no ofrece embeddings, y
    # el RAG los necesita: así el proyecto no depende de ningún proveedor para
    # vectorizar. Descarga el modelo (~220 MB) la primera vez.
    "fastembed>=0.4",
    # onnxruntime dejó de publicar wheels para macOS Intel tras la 1.23.2.
    # Sin el pin, `uv sync` falla al resolver en un Mac x86_64.
    "onnxruntime<1.24; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
# Embeddings vía HuggingFace/sentence-transformers (EMBEDDINGS_PROVIDER=huggingface).
# Extra APARTE porque arrastra PyTorch y ~16 paquetes. El ADR-0002 ya decidió no
# meter torch en el camino por defecto del curso ni en la CI.
#   uv sync --extra llmops --extra hf
#
# ⚠️ NO funciona en macOS Intel (x86_64): PyTorch no publica wheels para esa
#    plataforma desde la 2.2.2, y esa versión es incompatible con NumPy 2 y con
#    transformers>=5 (que exige torch>=2.4). No hay combinación que resuelva.
#    En ese caso usa EMBEDDINGS_PROVIDER=fastembed: es el MISMO modelo.
#    Comprobado en Linux y en Apple Silicon.
hf = [
    "langchain-huggingface>=0.1",
    "sentence-transformers>=3.0",
]

[tool.uv]
# El curso son SCRIPTS SUELTOS, no una librería instalable. Con package=false
# le decimos a uv que solo instale las dependencias y no intente construir
# un wheel de este proyecto (que no tiene nada que empaquetar).
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Solo se usa si alguien hace `pip install -e .` (no con uv). Sin esto,
# hatchling se queja de que no encuentra qué empaquetar.
bypass-selection = true

[tool.pytest.ini_options]
# Tres suites: los ejemplos, el proyecto final modular y el proyecto LLMOps.
testpaths = ["tests", "proyecto_final/tests", "proyecto_llmops/tests"]
# Añade al path la carpeta del curso (para 'import util'), la del proyecto
# LLMOps (para 'import app.config', 'import guardrails.rbac'…) y la del
# proyecto final (para 'import config', 'import rag'…, igual que main.py).
#
# ⚠️ EL ORDEN IMPORTA: 'proyecto_llmops' va ANTES que 'proyecto_final', porque
#    los dos ofrecen un 'app'. Aquí gana el paquete proyecto_llmops/app/ y no
#    el shim proyecto_final/app.py. (Y por eso app/ necesita su __init__.py:
#    sin él sería un namespace package y perdería igual, fuese cual fuese el orden.)
pythonpath = [".", "proyecto_llmops", "proyecto_final"]
# Cualquier archivo que empiece con test_ se considera test.
#
# ⚠️ Los nombres de archivo deben ser ÚNICOS entre las tres suites. Las carpetas
#    tests/ no son paquetes (no tienen __init__.py), así que pytest importa
#    'test_rag' a secas: dos archivos con ese nombre chocan al recolectar.
#    Por eso el del proyecto LLMOps se llama test_rag_rbac.py.
python_files = ["test_*.py"]
# Marcadores propios: '@pytest.mark.offline' marca tests que NO llaman a la API.
markers = [
    "offline: tests que NO usan GOOGLE_API_KEY (los que corre la CI)",
    "llm: tests que SÍ llaman a la API de Gemini (se omiten en CI sin secrets)",
]
# Por defecto corremos todo; la CI usa '-m offline' para no gastar cuota.
addopts = "-ra"
