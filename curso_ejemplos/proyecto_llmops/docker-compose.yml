# ==========================================================
# docker-compose.yml · Infraestructura LLMOps de GobData
# ==========================================================
# Levanta los TRES servicios de los que depende el proyecto en producción:
#
#   postgres   → base de datos relacional + extensión pgvector (vector store del RAG)
#   redis      → backend del semantic cache (resuelve preguntas repetitivas a costo ~0)
#   langfuse   → observabilidad: trazas forenses de cada ejecución + métricas + costos
#
# USO:
#   docker compose up -d            # levanta todo en segundo plano
#   docker compose ps               # ver qué está corriendo
#   docker compose logs -f langfuse # ver trazas
#   docker compose down             # parar (los datos sobreviven en volúmenes)
#   docker compose down -v          # parar Y borrar los datos (¡cuidado!)
#
# ⚠️  Usamos Langfuse **v2** (self-hosted, gratis), no la v3.
#     La v3 partió el servicio en seis contenedores (web, worker, Postgres,
#     ClickHouse, Redis y MinIO) y pide ~8 GB de RAM: es lo correcto a escala,
#     pero para aprender observabilidad basta la v2, que corre con un solo
#     Postgres. Ver docs/adr/0004-langfuse.md.
#     No envía nada a terceros: toda la observabilidad se queda en tu máquina.
# ==========================================================

name: gobdata-llmops

services:
  # ------------------------------------------------------------------
  # 1) POSTGRES + pgvector: el "libro abierto" persistente del RAG.
  #    El ADR-0001 eligió InMemoryVectorStore y fijó tres disparadores para
  #    revisar esa decisión. Aquí se cumple el TERCERO: "el proyecto se despliega
  #    con más de un proceso (un servidor web, el tema 17)".
  #    Ojo: el ADR-0001 proponía Chroma como primer paso. El ADR-0003 explica por
  #    qué, con varios workers de uvicorn, saltamos directamente a pgvector.
  # ------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: gobdata-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gobdata
      POSTGRES_PASSWORD: gobdata
      POSTGRES_DB: gobdata
    ports:
      - "5433:5432"   # 5433 en el host (para no chocar con un Postgres local)
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gobdata"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ------------------------------------------------------------------
  # 2) REDIS: backend del semantic cache.
  #    Una pregunta repetida (o semánticamente igual) se responde SIN tocar el LLM.
  # ------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: gobdata-redis
    restart: unless-stopped
    ports:
      - "6380:6379"   # 6380 en el host (para no chocar con un Redis local)
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ------------------------------------------------------------------
  # 3) LANGFUSE: observabilidad end-to-end (self-hosted).
  #    Cada request del agente genera una traza con: prompt, respuesta,
  #    tokens, costo, latencia (TTFT) y el grafo de llamadas internas.
  #    UI en http://localhost:3000  (usuario: langfuse@local / clave: langfuse)
  # ------------------------------------------------------------------
  langfuse:
    # v2: una sola imagen + un Postgres. La v3 necesitaría además clickhouse,
    # minio, redis y un contenedor 'worker' aparte.
    image: langfuse/langfuse:2
    container_name: gobdata-langfuse
    restart: unless-stopped
    depends_on:
      langfuse-db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      # Langfuse necesita SU PROPIA base de datos (distinta del RAG).
      DATABASE_URL: "postgresql://langfuse:langfuse@langfuse-db:5432/langfuse"
      # ⚠️ SIN DEFAULT A PROPÓSITO. La sintaxis `${VAR:?mensaje}` hace que
      #    `docker compose up` FALLE si la variable no está definida, en vez de
      #    arrancar con un secreto de ejemplo que todo el mundo conoce.
      #    Antes aquí había literales "cambia-esto-en-produccion...": funcionaban,
      #    y por eso nadie los cambiaba. Un secreto por defecto es un secreto
      #    público. Genera los tuyos con:  openssl rand -base64 32
      #    (El .env.example de al lado ya trae las dos líneas listas para copiar.)
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?define NEXTAUTH_SECRET en tu .env (openssl rand -base64 32)}
      SALT: ${LANGFUSE_SALT:?define LANGFUSE_SALT en tu .env (openssl rand -base64 32)}
      NEXTAUTH_URL: "http://localhost:3000"
      # Telemetría de Langfuse desactivada (no reporta a terceros).
      TELEMETRY_ENABLED: "false"
      # Auth por env (para no pelear con el wizard la primera vez):
      LANGFUSE_INIT_ORG_ID: "gobdata"
      LANGFUSE_INIT_ORG_NAME: "GobData"
      LANGFUSE_INIT_PROJECT_ID: "gobdata-prod"
      LANGFUSE_INIT_PROJECT_NAME: "GobData Producción"
      # Estas SÍ llevan default, y es una decisión distinta: son las llaves con
      # las que Langfuse se autoinicializa en LOCAL, y tienen que coincidir con
      # las del .env de la app para que el tracing funcione nada más levantar.
      # No protegen nada (el servicio solo escucha en tu máquina); si expones
      # Langfuse a una red real, cámbialas por env como las de arriba.
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-local-demo}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-local-demo}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/public/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # Base de datos interna de Langfuse (no se mezcla con la del RAG).
  langfuse-db:
    image: postgres:16-alpine
    container_name: gobdata-langfuse-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfusedata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ------------------------------------------------------------------
  # 4) LA APP: el servicio en sí, ya como imagen desplegable.
  #    Hasta la Fase 1 de la auditoría, este compose levantaba solo la
  #    infraestructura y la app se arrancaba a mano con `uvicorn --reload`.
  #    Eso servía para desarrollar, pero no había NADA que desplegar.
  #
  #    Se levanta con:  docker compose --profile app up -d
  #    Sin el perfil, `docker compose up -d` sigue levantando solo la infra,
  #    que es lo que quiere quien está siguiendo el curso y edita en caliente.
  # ------------------------------------------------------------------
  app:
    profiles: ["app"]
    build:
      # El contexto es curso_ejemplos/ (dos niveles arriba de este archivo):
      # la imagen necesita el pyproject.toml, el uv.lock y proyecto_final/.
      # Ver el encabezado del Dockerfile.
      context: ..
      dockerfile: proyecto_llmops/Dockerfile
    container_name: gobdata-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Dentro de la red de compose, los servicios se llaman por su NOMBRE, no
      # por localhost: 'localhost' dentro del contenedor es el contenedor mismo.
      PG_HOST: postgres
      PG_PORT: 5432          # el puerto interno, no el 5433 publicado al host
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LANGFUSE_HOST: http://langfuse:3000
      # ⚠️ Vacío se PASA vacío, y con eso el tracing se apaga solo (la app exige
      #    las dos llaves). Antes había aquí un default 'pk-lf-local-demo', y el
      #    daño era sutil: `:-` sustituye también cuando la variable está VACÍA,
      #    que es justo como viene en .env.example. El contenedor arrancaba con
      #    llaves de mentira, /health anunciaba "tracing": true y las trazas se
      #    tiraban al suelo. Un tracing apagado se ve; uno que miente, no.
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      # La llave del proveedor NO tiene default: sin ella el servicio no puede
      # responder, y es mejor no arrancar que arrancar roto.
      LLM_API_KEY: ${LLM_API_KEY:?define LLM_API_KEY en tu .env}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # En el contenedor sí tiene sentido persistir: hay Postgres al lado y
      # varias réplicas posibles. Cada worker escribiendo en su propia lista
      # haría que /metrics informara de una fracción arbitraria del tráfico.
      METRICAS_BACKEND: ${METRICAS_BACKEND:-postgres}
      # Vacío = servicio abierto (la app lo avisa al arrancar y lo publica en
      # /health). Para un despliegue real: API_KEYS=clave:rol,...
      API_KEYS: ${API_KEYS:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Sin curl: la imagen es slim y no lo trae. Se usa el Python que ya está.
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      # ⭐ El primer arranque descarga el modelo de embeddings (~220 MB) e indexa
      #    la normativa. Sin este margen, el orquestador lo daría por muerto y lo
      #    reiniciaría en bucle — reiniciando también la descarga, para siempre.
      start_period: 180s
    volumes:
      # Persiste el modelo de embeddings entre reinicios: sin esto, cada
      # arranque vuelve a descargar los ~220 MB.
      - fastembed:/srv/.cache/fastembed

volumes:
  pgdata:
  redisdata:
  langfusedata:
  fastembed:
