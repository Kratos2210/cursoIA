# Canal WhatsApp del curso: EvolutionAPI (puente a WhatsApp) + el webhook.
# FUERA DEL GATE OFFLINE (ADR-0004): necesita Docker y un número de WhatsApp.
#
#   1) cp .env.example .env  y rellena las llaves
#   2) docker compose up -d
#   3) En EvolutionAPI (http://localhost:8081) crea una instancia, escanea el QR
#      y apunta su webhook de mensajes a:  http://webhook:8080/webhook/whatsapp
#
# El webhook reutiliza util.crear_llm() del curso; por eso el build se hace desde
# la raíz de curso_ejemplos (para copiar util.py + canales/).
services:
  evolution-api:
    image: atendai/evolution-api:latest   # pínealo a una versión concreta en producción
    ports:
      - "8081:8080"
    environment:
      - AUTHENTICATION_API_KEY=${EVOLUTION_APIKEY}
      - DEL_INSTANCE=false
    volumes:
      - evolution_data:/evolution/instances

  webhook:
    build:
      context: ../..                       # raíz de curso_ejemplos (trae util.py)
      dockerfile: canales/whatsapp/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - EVOLUTION_URL=http://evolution-api:8080
      - EVOLUTION_INSTANCE=${EVOLUTION_INSTANCE}
      - EVOLUTION_APIKEY=${EVOLUTION_APIKEY}
      - LLM_PROVIDER=${LLM_PROVIDER}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
    depends_on:
      - evolution-api

  # --- Opcional: bandeja humana con Chatwoot (para escalar a un agente humano) ---
  # Descomenta y configura si quieres que las conversaciones caigan en una
  # bandeja donde un humano pueda tomar el control. No es necesario para el anexo.
  # chatwoot:
  #   image: chatwoot/chatwoot:latest
  #   ports: ["3000:3000"]
  #   environment:
  #     - SECRET_KEY_BASE=${CHATWOOT_SECRET}
  #   depends_on: [evolution-api]

volumes:
  evolution_data:
