# ==========================================================
# docker-compose.yml · Infraestructura opcional del asistente retail
# ==========================================================
# El asistente corre 100% sin Docker: el caché degrada a memoria y el tracing se
# apaga solo si no hay llaves. Este compose levanta lo ÚNICO que aporta a escala:
#
#   redis → backend del semantic cache, COMPARTIDO entre workers de uvicorn.
#           Sin él, cada worker tiene su caché en memoria y la tasa de aciertos
#           se divide entre el número de procesos.
#
# USO:
#   docker compose -f proyecto_retail/docker-compose.yml up -d
#   docker compose -f proyecto_retail/docker-compose.yml ps
#   docker compose -f proyecto_retail/docker-compose.yml down
#
# ⚠️ El puerto del host es 6381 (no 6379 ni 6380) para no chocar con un Redis
#    local ni con el de proyecto_llmops. Coincide con REDIS_PORT del .env.example.
# ==========================================================

name: sifrah-retail

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"
    volumes:
      - redis_data:/data
    # Persistencia ligera: un snapshot cada 60s si hubo >=1 cambio. El caché
    # tiene TTL de 24h de todas formas (ver cache/cache_backends.py).
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis_data:
